syntax = "proto3";

package bilibili.app.viewunite.v1;

message ViewReply {
    ReqUser req_user = 3;
    Tab tab = 5;
    optional bytes cm = 7;
}

message ReqUser {
    optional bytes elec_plus_btn = 7;
}

message Tab {
    repeated TabModule tab_module = 1;
}

message TabModule {
    TabType tab_type = 1;
    oneof tab {
        IntroductionTab introduction = 2;
    }
}

enum TabType {
    TAB_NONE = 0;
    TAB_INTRODUCTION = 1;
}

message IntroductionTab {
    repeated Module modules = 2;
}

message Module {
    ModuleType type = 1;
    oneof data {
        Headline head_line = 5;
        Relates relates = 22;
    }
}

enum ModuleType {
    UNKNOWN = 0;
    UGC_HEADLINE = 3;
    ACTIVITY = 18;
    RELATED_RECOMMEND = 28;
    PAY_BAR = 29;
    SPECIALTAG = 37;
    MERCHANDISE = 55;
    VIDEO_MENTIONS = 63;
}

message Headline {
    optional bytes label = 1;
}

message Relates {
    repeated RelateCard cards = 1;
}

message RelateCard {
    RelateCardType relate_card_type = 1;
    bytes cm_stock = 11;
    CardBasicInfo basic_info = 12;
}

enum RelateCardType {
    CARD_TYPE_UNKNOWN = 0;
    AV = 1;
    GAME = 4;
    CM_TYPE = 5;
    LIVE = 6;
    AI_RECOMMEND = 7;
    COURSE = 11;
}

message CardBasicInfo {
    string unique_id = 6;
}

message AIRelateAsyncReply {
    optional bytes cm = 1;
    AsyncModule module = 2;
}

message AsyncModule {
    repeated Module modules = 1;
}

message RelatesFeedReply {
    repeated RelateCard relates = 1;
}

message ViewProgressReq {
    int64 aid = 1;
    int64 cid = 2;
}

message ViewProgressReply {
    VideoGuide video_guide = 1;
    Chronos chronos = 2;
    optional bytes dm = 4;
}

message VideoGuide {
    VideoViewPoint video_point = 2;
}

message VideoViewPoint {
    repeated VideoPoint points = 1;
    bool point_permanent = 3;
}

message VideoPoint {
    int32 type = 1;
    int64 from = 2;
    int64 to = 3;
    string content = 4;
    string cover = 5;
}

message Chronos {
    string md5 = 1;
    string file = 2;
    optional string sign = 3;
}
